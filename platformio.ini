[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM7
upload_speed = 115200
lib_deps = 
	adafruit/Adafruit GFX Library @ ^1.11.9
	bblanchon/ArduinoJson @ ^6.21.3
	knolleary/PubSubClient @ ^2.8

[env:native]
platform = native
test_framework = unity
